[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dart-regression-testing"
version = "0.1.0"
description = "Dependency-Aware Regression Testing with MCP and LLM-assisted test selection"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp[cli]>=1.28,<2",
  "streamlit>=1.40,<2",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "groq>=0.11,<1",
  "gitpython>=3.1,<4",
  "networkx>=3.3,<4",
  "plotly>=5.24,<7",
  "pandas>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.7,<1", "mypy>=1.13,<2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/dart"]
